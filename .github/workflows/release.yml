name: Release sandbox pack
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx playwright@1.63.0 install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends libfaketime
      - name: Build with public tools through a fresh World
        run: bun scripts/run-world.ts build
      - name: Assess the independent pack through a fresh World
        run: bun scripts/run-world.ts assess --browser
      - name: Pack immutable release bytes
        run: |
          mkdir -p release
          cd tavily
          npm pack --ignore-scripts --pack-destination ../release
      - name: Publish the sandbox package with real repository provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --access public --provenance release/volter-twin-sandbox-tavily-0.0.1.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-pack-${{ github.run_id }}
          path: |
            assessment/
            release/
