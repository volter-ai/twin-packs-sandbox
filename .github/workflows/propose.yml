name: Retry sandbox catalog proposal
on:
  workflow_dispatch:
    inputs:
      version:
        description: Already published exact package version; never republishes
        required: true
        type: string
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare existing immutable published identity
        env:
          SUBMISSION_VERSION: ${{ inputs.version }}
        run: node node_modules/@volter/twin-catalog-sandbox/bin/twin-catalog.mjs submit --confirm-published --source sandbox-publisher --vendor tavily --package @volter/twin-sandbox-tavily --version "$SUBMISSION_VERSION" --out-dir "$RUNNER_TEMP/catalog-submissions"
      - name: Mint a repository-scoped catalog proposal token
        id: catalog-proposal-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CATALOG_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_PR_APP_PRIVATE_KEY }}
          owner: volter-ai
          repositories: twin-catalog-sandbox
          permission-contents: write
          permission-pull-requests: write
      - name: Propose data without republishing, reopening or merging
        env:
          GH_TOKEN: ${{ steps.catalog-proposal-token.outputs.token }}
        run: node node_modules/@volter/twin-catalog-sandbox/bin/twin-catalog.mjs propose --repository volter-ai/twin-catalog-sandbox --from "$RUNNER_TEMP/catalog-submissions" --send
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-submissions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-submissions/
          if-no-files-found: ignore
